<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <div class="container">
        <h2>Password Generator</h2>
        <div class="result-container">
            <span id="result"></span>
            <button class="btn" id="clipboard" data-clipboard-target="#result">
                <i class="far fa-clipboard"></i>
            </button>

        </div>
        <div class="settings">
            <div class="item">
                <label for="">Password length</label>
                <input type="number" id="length" value="20">  
            </div>
            <div class="item">
                <label for="">Include uppercase letters</label>
                <input type="checkbox" id="uppercase" checked >  
            </div>
            <div class="item">
                <label for="">Include lowercase letters</label>
                <input type="checkbox" id="lowercase" checked >  
            </div>
            <div class="item">
                <label for="">Include numbers</label>
                <input type="checkbox" id="numbers" checked >  
            </div>
            <div class="item">
                <label for="">Include symbols</label>
                <input type="checkbox" id="symbols" checked >  
            </div>
            
            </div>
            <button class="btn-large" id="generate-btn"> Generate Password</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.11/clipboard.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
